<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>joshey40</title>
    <style>
        :root {
            --bg: #f6f6f4;
            --card: #ffffff;
            --text: #1d1d1f;
            --muted: #6b6b70;
            --border: #e2e2e0;
            --accent: #3b5bdb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141416;
                --card: #1e1e21;
                --text: #ececef;
                --muted: #9a9aa2;
                --border: #2e2e33;
                --accent: #8fa6ff;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 16px;
        }
        h1 { margin: 0 0 32px; font-size: 2rem; }
        h2 {
            margin: 32px 0 12px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
        a {
            display: block;
            padding: 14px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            transition: border-color 0.15s;
        }
        a:hover, a:focus-visible { border-color: var(--accent); }
        .name { font-weight: 600; }
        .desc { display: block; color: var(--muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <main>
        <h1>joshey40</h1>

        <h2>D&amp;D</h2>
        <ul>
            <li><a href="DND/Wildshape/"><span class="name">Wild Shape Manager</span><span class="desc">Browse and filter D&amp;D Wild Shape forms.</span></a></li>
            <li><a href="DND/AbilityScores/"><span class="name">Ability Score Methods</span><span class="desc">Compare D&amp;D ability score generation methods.</span></a></li>
        </ul>

        <h2>Custom Marvel Snap</h2>
        <ul>
            <li><a href="CustomMarvelSnap/CardMaker/"><span class="name">Card Maker</span><span class="desc">Create custom Marvel Snap cards.</span></a></li>
            <li><a href="CustomMarvelSnap/DeckMaker/"><span class="name">Deck Maker</span><span class="desc">Build decks from official and custom cards.</span></a></li>
        </ul>
    </main>
</body>
</html>
